name: Publish hotfix
on:
  push:
    paths:
      - '.github/workflows/publish-hotfix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          echo '' | base64 -d | python
      - name: Commit
        run: |
          git config user.name 'MEMESTACK Hotfix'
          git config user.email 'actions@github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: make meme publishing reliable'
          git push
